name: CI

on:
  push:
    branches: [main]
    paths: ["packages/**", "test-support/**", "scripts/**", "*.json", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["packages/**", "test-support/**", "scripts/**", "*.json", ".github/workflows/ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Bun is the test runner only; npm owns installs and the lockfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm audit --audit-level=moderate
