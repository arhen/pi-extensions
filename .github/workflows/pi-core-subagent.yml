name: Extension CI

on:
  push:
    branches: [main]
    paths: ["packages/**", "package.json", "package-lock.json", "bun.lock", ".github/workflows/pi-core-subagent.yml"]
  pull_request:
    branches: [main]
    paths: ["packages/**", "package.json", "package-lock.json", "bun.lock", ".github/workflows/pi-core-subagent.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
